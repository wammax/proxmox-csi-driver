allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: proxmox-zfs-named
parameters:
  csi.storage.k8s.io/fstype: xfs
  #
  storage: zfs
  # Predictable disk name: a PVC myns/data gets the disk "zfs:vm-9999-myns.data".
  # A recreated PVC with the same namespace and name gets its old disk back.
  # See docs/disk-name.md
  diskName: "${pvc.metadata.namespace}.${pvc.metadata.name}"
  # Several Kubernetes clusters sharing one Proxmox storage:
  # set features.k8sClusterName in the driver config and use
  # diskName: "${k8sClusterName}.${pvc.metadata.namespace}.${pvc.metadata.name}"
provisioner: csi.proxmox.sinextra.dev
# Keep the disk when the PVC is deleted, so it can be reused.
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
